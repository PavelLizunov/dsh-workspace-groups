# dsh-workspace-groups sidecar config
#
# This file controls sidebar classification rules: how the tree
# (category folders -> project folders -> sessions) organizes projects.
# Changes take effect immediately after a page reload without code changes,
# DSH restarts, or touching ~/.dsh/storages/workspace.json.
#
# Default path: ~/.dsh/workspace-groups.yaml
# Rule semantics: workspaces match categories in order; the first matching
# category applies. Workspaces matching no rules appear at the top level.
# Each category's rules use OR logic (any matching rule assigns the workspace).

categories:
  # -- DSH Plugins --
  - name: DSH Plugins
    rules:
      - pathPrefix: /Users/zcol/Project/SkillsManagePlugins
      - pathPrefix: /Users/zcol/Project/Documentation-Driven AI Coding
      - pathPrefix: /Users/zcol/Project/DeepSeek-Peak-Valley-Widget
      - pathPrefix: /Users/zcol/Project/DSH-Workspace-Groups
      # You can also match by project display name or directory basename, e.g.:
      # - nameContains: plugin
      # - basenameContains: plugin

  # -- Personal Projects --
  - name: Personal Projects
    rules:
      - pathPrefix: /Users/zcol/Project/yeluzi
      - pathPrefix: /Users/zcol/Project/chat-app

# Projects that do not match any category (e.g. newly added /Users/zcol/Project/new-project)
# will automatically appear as top-level projects, never omitted.
